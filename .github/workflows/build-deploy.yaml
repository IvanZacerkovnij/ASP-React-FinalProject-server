name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          version: 1.8.4
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          debug: true
          request_pty: true

          script: |
            set -e

            echo "STEP 1: remote shell started"
            id

            echo "STEP 2: opening repository"
            cd "$HOME/threads"

            echo "STEP 3: pulling repository"
            git pull --ff-only origin main

            echo "STEP 4: configuring nginx"
            sudo cp "$HOME/threads/deploy/nginx/threads.conf" /etc/nginx/sites-available/threads
            sudo ln -sf /etc/nginx/sites-available/threads /etc/nginx/sites-enabled/threads

            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            echo "STEP 5: writing environment"
            cat > .env <<'EOF'
            ${{ secrets.APP_ENV_FILE }}
            EOF

            echo "STEP 6: stopping old containers"
            docker compose down --remove-orphans

            echo "STEP 7: building and starting containers"
            docker compose up -d --build

            echo "STEP 8: checking deployment"
            docker compose ps
