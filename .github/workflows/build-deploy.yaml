name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_URI: ghcr.io/${{ vars.CONTAINER_IMAGE_REPOSITORY }}
  DEPLOY_PATH: /opt/threads

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:latest
            ${{ env.IMAGE_URI }}:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,deploy/nginx/threads.conf"
          target: /opt/threads

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cat > /opt/threads/.env <<'EOF'
            ${{ secrets.APP_ENV_FILE }}
            EOF

            cd /opt/threads

            echo '${{ secrets.REGISTRY_PASSWORD }}' | docker login ghcr.io \
              -u '${{ secrets.REGISTRY_USERNAME }}' \
              --password-stdin

            export IMAGE_URI='${{ env.IMAGE_URI }}'
            export IMAGE_TAG='sha-${{ github.sha }}'

            docker compose pull
            docker compose up -d --remove-orphans

            sudo cp deploy/nginx/threads.conf /etc/nginx/sites-available/threads
            sudo nginx -t
            sudo systemctl reload nginx