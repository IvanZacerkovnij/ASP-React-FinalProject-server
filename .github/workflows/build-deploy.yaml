name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  CONTAINER_IMAGE_REPOSITORY: ${{ vars.CONTAINER_IMAGE_REPOSITORY }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
  NGINX_SITE_PATH: ${{ vars.NGINX_SITE_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image URI
        id: image
        run: echo "image_uri=${CONTAINER_REGISTRY}/${CONTAINER_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image_uri }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,deploy/nginx/threads.conf"
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull image and restart service
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          IMAGE_TAG: sha-${{ github.sha }}
          CONTAINER_REGISTRY: ${{ env.CONTAINER_REGISTRY }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          NGINX_SITE_PATH: ${{ env.NGINX_SITE_PATH }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_URI,IMAGE_TAG,CONTAINER_REGISTRY,DEPLOY_PATH,NGINX_SITE_PATH
          script: |
            set -eu

            mkdir -p "${DEPLOY_PATH}"

            cat > "${DEPLOY_PATH}/.env" <<'EOF'
            ${{ secrets.APP_ENV_FILE }}
            EOF

            cd "${DEPLOY_PATH}"

            printf '%s' '${{ secrets.REGISTRY_PASSWORD }}' | docker login "${CONTAINER_REGISTRY}" \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

            export IMAGE_URI
            export IMAGE_TAG

            docker compose pull
            docker compose up -d --remove-orphans

            sudo cp "${DEPLOY_PATH}/deploy/nginx/threads.conf" "${NGINX_SITE_PATH}"
            sudo nginx -t
            sudo systemctl reload nginx
