name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          version: 1.8.4
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script: |
            set -e

            echo "STEP 1: remote shell started"
            id

            echo "STEP 2: opening repository"
            cd "$HOME/threads"

            echo "STEP 3: pulling repository"
            git pull --ff-only origin main

            echo "STEP 4: writing environment"
            cat > .env <<'EOF'
            ${{ secrets.APP_ENV_FILE }}
            EOF

            echo "STEP 5: stopping old containers"
            docker compose down --remove-orphans

            echo "STEP 6: building and starting containers"
            docker compose up -d --build

            echo "STEP 7: checking deployment"
            docker compose ps
